name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Elinor-reloaded.sln -c Release

      - name: Publish single-file exe
        run: dotnet publish Elinor/Elinor.csproj -p:PublishProfile=win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: Elinor-win-x64
          path: Elinor/bin/publish/Elinor.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Elinor/bin/publish/Elinor.exe
