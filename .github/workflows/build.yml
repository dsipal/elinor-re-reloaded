name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build release assets for, e.g. v1.0.0'
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Set for tag pushes and manual runs; empty for normal pushes and PRs.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG) {
            $v = $env:RELEASE_TAG.TrimStart('v')
          } else {
            $v = (Select-Xml -Path Elinor/Elinor.csproj -XPath '//Version').Node.InnerText
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3 (tag v1.2.3), got '$v'" }
          "VERSION=$v" >> $env:GITHUB_ENV
          "Building version $v"

      - name: Test
        run: dotnet test Elinor-reloaded.sln -c Release

      - name: Publish single-file exe
        run: dotnet publish Elinor/Elinor.csproj -p:PublishProfile=win-x64 -p:Version=${{ env.VERSION }}

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVersion=$env:VERSION" installer\Elinor.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v6
        with:
          name: Elinor-${{ env.VERSION }}
          path: |
            installer/Output/Elinor-Setup-${{ env.VERSION }}.exe
            Elinor/bin/publish/Elinor.exe

      - name: Create or update GitHub release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "installer/Output/Elinor-Setup-$env:VERSION.exe", "Elinor/bin/publish/Elinor.exe"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @files --clobber
          } else {
            gh release create $env:RELEASE_TAG @files --verify-tag --generate-notes --title "Elinor $env:VERSION"
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
